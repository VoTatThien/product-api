# docker-compose-prod.yaml
# Pulls the product-api image from Docker Hub after CD pipeline
# Usage: docker compose -f docker-compose-prod.yaml up -d

services:
  nammongodb:
    image: mongo:7
    container_name: nammongodb-prod
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin123}
    volumes:
      - mongodb_prod_data:/data/db
    networks:
      - product-network-prod
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try {
            db.adminCommand('ping');
            print('MongoDB is healthy');
          } catch(e) {
            print('MongoDB is NOT healthy: ' + e);
            quit(1);
          }
        "
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  product-api:
    # === THAY <your-dockerhub-username> bằng Docker Hub username thực tế ===
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/product-api:latest
    container_name: product-api-prod
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-admin123}@nammongodb:27017/productdb?authSource=admin
    depends_on:
      nammongodb:
        condition: service_healthy
    networks:
      - product-network-prod
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  mongodb_prod_data:
    driver: local

networks:
  product-network-prod:
    driver: bridge
